name: Windows portatil e release
on:
  workflow_dispatch:
  push:
    branches: ['release/windows-*']
    tags: ['v*']
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Gerar aplicativo Windows portatil
        run: npx electron-builder --win portable --x64 --publish never
      - name: Preparar arquivos para download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/downloads
          cp 'release/Cronograma de Estudos 1.0.0.exe' release/downloads/Cronograma-de-Estudos-Windows-x64.exe
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('release/downloads/cronograma-windows.zip', 'w', compression=zipfile.ZIP_STORED) as archive:
              archive.write('release/downloads/Cronograma-de-Estudos-Windows-x64.exe', 'Cronograma-de-Estudos-Windows-x64.exe')
          PY
          cd release/downloads
          sha256sum Cronograma-de-Estudos-Windows-x64.exe cronograma-windows.zip > SHA256SUMS.txt
      - name: Publicar versao no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/windows-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$(node -p "require('./package.json').version")"
          fi
          gh release create "$release_tag" --verify-tag --title "Cronograma de Estudos $release_tag" --notes-file docs/RELEASE.md release/downloads/Cronograma-de-Estudos-Windows-x64.exe release/downloads/cronograma-windows.zip release/downloads/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: cronograma-de-estudos-windows-x64
          compression-level: 0
          retention-days: 7
          path: release/downloads/*
