name: Aplicativo Windows e release
on:
  workflow_dispatch:
  push:
    branches: ['release/windows-*']
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Gerar instalador e aplicativo portatil
        run: npx electron-builder --win nsis portable --x64
      - name: Preparar arquivos para download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/downloads | Out-Null
          Copy-Item 'release/Cronograma de Estudos 1.0.0.exe' 'release/downloads/Cronograma-de-Estudos-Windows-x64.exe'
          Copy-Item 'release/Cronograma de Estudos Setup 1.0.0.exe' 'release/downloads/Cronograma-de-Estudos-Instalador-x64.exe'
          Compress-Archive -Path 'release/downloads/Cronograma-de-Estudos-Windows-x64.exe' -DestinationPath 'release/downloads/cronograma-windows.zip'
          Get-ChildItem release/downloads -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release/downloads/SHA256SUMS.txt
      - name: Publicar versao no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/windows-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v' + (node -p "require('./package.json').version") }
          gh release create $tag --verify-tag --title "Cronograma de Estudos $tag" --notes-file docs/RELEASE.md 'release/downloads/Cronograma-de-Estudos-Windows-x64.exe' 'release/downloads/Cronograma-de-Estudos-Instalador-x64.exe' 'release/downloads/cronograma-windows.zip' 'release/downloads/SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: cronograma-de-estudos-windows-x64
          compression-level: 0
          retention-days: 7
          path: |
            release/downloads/cronograma-windows.zip
            release/downloads/Cronograma-de-Estudos-Instalador-x64.exe
            release/downloads/SHA256SUMS.txt
